<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 135" width="100%" height="135">
  <defs>
    <!-- Tiro Bangla ও আধুনিক সাপোর্টিং ফন্ট -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
      
      .brand-title {
        font-family: 'Tiro Bangla', serif;
        font-size: 48px;
        font-weight: 700;
        fill: #064e3b; /* Deep Nature Green */
      }
      .brand-highlight {
        fill: url(#natureGrad);
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 4.5px;
        fill: #059669;
      }
    </style>

    <!-- প্রকৃতির সবুজ ও স্কাই ব্লু গ্রেডিয়েন্ট -->
    <linearGradient id="natureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="hillDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="hillSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="skyKite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="sunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- আইকন কম্পোজিশন: পাহাড়, আঁকাবাঁকা পথ ও ঘুড়ি -->
  <g transform="translate(20, 14)" filter="url(#softGlow)">
    
    <!-- ব্যাকগ্রাউন্ড সকালের স্নিগ্ধ সূর্য -->
    <circle cx="56" cy="42" r="22" fill="url(#sunGold)" opacity="0.9" />

    <!-- দূরবর্তী হালকা সবুজ পাহাড় (Hills Silhouette) -->
    <path d="M 6 88 Q 38 32, 68 54 Q 90 40, 114 88 Z" fill="url(#hillSoft)" opacity="0.6" />

    <!-- সামনের গাঢ় সবুজ মেইন পাহাড় -->
    <path d="M 18 90 L 52 38 L 86 90 Z" fill="url(#hillDeep)" />
    <!-- পাহাড়ের হাইলাইট কাটিং -->
    <path d="M 52 38 L 38 64 L 52 58 Z" fill="#6ee7b7" opacity="0.4" />

    <!-- সবুজ উপত্যকার বুক চিরে যাওয়া ট্র্যাভেল রোড (Winding Scenic Road) -->
    <path d="M 50 62 C 40 70, 68 76, 32 94" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />
    <!-- রোডের সেন্টার ডিভাইডার লাইন -->
    <path d="M 48 64 C 42 71, 64 77, 34 92" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3" />

    <!-- আকাশে উড়ন্ত আধুনিক মিনিমালিস্ট ঘুড়ি (Modern Soaring Kite) -->
    <g transform="translate(68, 6) rotate(12)">
      <!-- ঘুড়ির ডানা -->
      <polygon points="18,0 32,16 18,30 6,16" fill="url(#skyKite)" />
      <!-- ঘুড়ির অভ্যন্তরীণ ভাঁজ ও থ্রি-ডি শেড -->
      <polygon points="18,0 32,16 18,30 18,14" fill="#0369a1" />
      <polygon points="6,16 18,14 18,30" fill="#38bdf8" />
      
      <!-- ঘুড়ির সূক্ষ্ম রিদমিক লেজ (মুক্ত বাতাসের প্রতীক) -->
      <path d="M 18 30 Q 28 42, 14 50 T 24 64" fill="none" stroke="url(#sunGold)" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- ছোট পাখির ঝাঁক (প্রকৃতির ছোঁয়া) -->
    <path d="M 22 30 Q 25 27, 28 30 Q 31 27, 34 30" fill="none" stroke="#047857" stroke-width="1.4" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- টাইপোগ্রাফি (Tiro Bangla) -->
  <g transform="translate(155, 68)">
    <text x="0" y="0" class="brand-title">
      চলো<tspan class="brand-highlight">ঘুড়ি</tspan>
    </text>
    
    <!-- প্রকৃতির থিমের সাথে সামঞ্জস্যপূর্ণ স্লোগান -->
    <text x="3" y="28" class="brand-sub">
      EXPLORE NATURE • HILLS &amp; TRAILS
    </text>

    <!-- প্রকৃতির সবুজ পাতার মতো অ্যাকসেন্ট লাইন -->
    <line x1="3" y1="38" x2="60" y2="38" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="68" cy="38" r="2.5" fill="#f59e0b" />
  </g>
</svg>
